 [project]
 name = "ip-geo-service"
 version = "0.1.0"
 description = "FastAPI IP geolocation microservice"
 requires-python = ">=3.11"
 dependencies = [
   "fastapi>=0.115.0",
   "httpx>=0.27.0",
   "pydantic>=2.6.0",
   "uvicorn>=0.30.0",
 ]
 
 [project.optional-dependencies]
 dev = [
   "mypy>=1.8.0",
  "pre-commit>=3.6.0",
   "pytest>=8.0.0",
   "pytest-asyncio>=0.23.0",
  "pyyaml>=6.0.1",
  "types-PyYAML>=6.0.12.20250915",
   "respx>=0.21.0",
   "ruff>=0.6.0",
 ]
 
[tool.setuptools]
packages = ["app"]

 [tool.ruff]
 line-length = 100
 target-version = "py311"
 
 [tool.ruff.lint]
 select = ["E", "F", "I", "UP", "B"]
 
 [tool.ruff.format]
 quote-style = "double"
 indent-style = "space"
 
 [tool.mypy]
 python_version = "3.11"
 warn_return_any = true
 warn_unused_configs = true
 disallow_untyped_defs = true
 no_implicit_optional = true
 strict_optional = true
 check_untyped_defs = true
 ignore_missing_imports = true
 
 [tool.pytest.ini_options]
 asyncio_mode = "auto"
 testpaths = ["tests"]
